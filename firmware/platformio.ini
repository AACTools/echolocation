; echolocation firmware — M5Stack CoreS3 + Module USB v1.2 + Module Audio

[platformio]
default_envs = m5stack-cores3
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

[common]
framework = arduino
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
    https://github.com/felis/USB_Host_Shield_2.0.git
    h2zero/NimBLE-Arduino@^2.3.8
    https://github.com/t-vk/ESP32-BLE-Keyboard.git

[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
upload_speed = 1500000
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TINYUSB_ENABLED=1
    -DCONFIG_TINYUSB_HID_ENABLED=1
    -DARDUINO_M5STACK_CORES3=1
    -DLV_CONF_PATH='"${platformio.include_dir}/lv_conf.h"'
lib_deps =
    ${common.lib_deps}
    lvgl/lvgl@^9.1.0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DNATIVE_TEST=1
build_src_filter =
    -<*>
    +<../lib/echolocation_core/*>
test_filter =
    test_core
