; PlatformIO config for M5Stack CoreS3 echolocation firmware
[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200

lib_deps =
  m5stack/M5Unified
  lvgl/lvgl
  adafruit/Adafruit BusIO
  adafruit/Adafruit GFX Library
  ; USB Host and BLE HID libs are hardware-specific; add here when selected.

build_flags =
  -DECHOLOCATION_ENABLE_LOGS
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
