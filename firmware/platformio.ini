; echolocation firmware — M5Stack CoreS3
;
; USB HID keyboard mode (ARDUINO_USB_MODE=0) uses the USB-C port as a composite
; keyboard + serial device. Uploads still work, but you may need download mode:
;   1. Long-press the RST button on the CoreS3 until the screen goes blank, OR
;   2. Run upload and let PlatformIO auto-reset (settings below).
; After flashing, pick the new serial port in the PlatformIO status bar if upload
; fails to find the device.

[platformio]
default_envs = m5stack-cores3
src_dir = src
include_dir = include

[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_M5STACK_CORES3=1
    -DLV_CONF_PATH='"${platformio.include_dir}/lv_conf.h"'
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5GFX@^0.2.2
    lvgl/lvgl@^9.1.0
    https://github.com/felis/USB_Host_Shield_2.0.git
