name: Release firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-platformio

      - name: Run native unit tests
        working-directory: firmware
        run: pio test -e native

      - name: Build CoreS3 firmware
        working-directory: firmware
        run: pio run -e m5stack-cores3

      - name: Package firmware binaries
        env:
          TAG: ${{ inputs.tag }}
        run: |
          BUILD=firmware/.pio/build/m5stack-cores3
          DIST=dist/echolocation-cores3-${TAG}
          mkdir -p "$DIST"
          cp "$BUILD/firmware.bin" "$BUILD/bootloader.bin" "$BUILD/partitions.bin" "$DIST/"
          cat > "$DIST/FLASHING.txt" << 'EOF'
          Flash with PlatformIO (recommended):
            cd firmware && pio run -e m5stack-cores3 -t upload

          If upload fails (device is acting as a USB keyboard), put the CoreS3 in
          download mode first: long-press the RST button until the screen goes blank,
          then run the upload command again. Pick the USB serial port shown in
          PlatformIO's status bar if prompted.

          Or with esptool (ESP32-S3; replace PORT with your serial device):
            esptool.py --chip esp32s3 -p PORT write_flash \
              0x0 bootloader.bin \
              0x8000 partitions.bin \
              0x10000 firmware.bin
          EOF
          (cd dist && zip -r "echolocation-cores3-${TAG}.zip" "echolocation-cores3-${TAG}")

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          if-no-files-found: error
          path: |
            dist/echolocation-cores3-${{ inputs.tag }}.zip
            firmware/.pio/build/m5stack-cores3/firmware.bin

  generate-audio:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate microSD speech files
        working-directory: scripts/generate-tts
        run: npm install && npm run generate

      - name: Package microSD audio
        env:
          TAG: ${{ inputs.tag }}
        run: |
          DIST=dist/echolocation-sd-audio-${TAG}
          mkdir -p "$DIST/audio/keys"
          cp sd-card/audio/keys/*.wav "$DIST/audio/keys/"
          cat > "$DIST/SD_CARD.txt" << 'EOF'
          Copy the contents of this folder to the root of a FAT32 microSD card.
          The card should contain /audio/keys/*.wav (same layout as this archive).
          Insert the card into the CoreS3 SD slot before use.
          EOF
          (cd dist && zip -r "echolocation-sd-audio-${TAG}.zip" "echolocation-sd-audio-${TAG}")

      - name: Upload audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sd-audio
          if-no-files-found: error
          path: dist/echolocation-sd-audio-${{ inputs.tag }}.zip

  release:
    needs: [build-firmware, generate-audio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify release assets
        run: |
          set -e
          for f in \
            "artifacts/firmware-release/dist/echolocation-cores3-${{ inputs.tag }}.zip" \
            "artifacts/firmware-release/firmware/.pio/build/m5stack-cores3/firmware.bin" \
            "artifacts/sd-audio/echolocation-sd-audio-${{ inputs.tag }}.zip"
          do
            test -f "$f" || { echo "Missing release asset: $f"; ls -R artifacts; exit 1; }
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: echolocation ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/firmware-release/dist/echolocation-cores3-${{ inputs.tag }}.zip
            artifacts/firmware-release/firmware/.pio/build/m5stack-cores3/firmware.bin
            artifacts/sd-audio/echolocation-sd-audio-${{ inputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
