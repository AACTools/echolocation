name: Release firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-platformio

      - name: Run native unit tests
        working-directory: firmware
        run: pio test -e native

      - name: Build CoreS3 firmware
        working-directory: firmware
        run: pio run -e m5stack-cores3

      - name: Package firmware binaries
        env:
          TAG: ${{ inputs.tag }}
        run: |
          BUILD=firmware/.pio/build/m5stack-cores3
          DIST=dist/echolocation-cores3-${TAG}
          mkdir -p "$DIST"
          cp "$BUILD/firmware.bin" "$BUILD/bootloader.bin" "$BUILD/partitions.bin" "$DIST/"
          cat > "$DIST/FLASHING.txt" << 'EOF'
          Flash with PlatformIO (recommended):
            cd firmware && pio run -e m5stack-cores3 -t upload

          Or with esptool (ESP32-S3; replace PORT with your serial device):
            esptool.py --chip esp32s3 -p PORT write_flash \
              0x0 bootloader.bin \
              0x8000 partitions.bin \
              0x10000 firmware.bin
          EOF
          (cd dist && zip -r "../echolocation-cores3-${TAG}.zip" "echolocation-cores3-${TAG}")

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: echolocation ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/echolocation-cores3-${{ inputs.tag }}.zip
            firmware/.pio/build/m5stack-cores3/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
