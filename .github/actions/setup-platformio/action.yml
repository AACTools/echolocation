name: Setup PlatformIO
description: Install PlatformIO and cache dependencies for firmware builds

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install PlatformIO
      shell: bash
      run: pip install platformio

    - name: Cache PlatformIO packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio/.cache
          ~/.platformio/packages
          ~/.platformio/platforms
        key: platformio-${{ runner.os }}-espressif32-6.9.0-${{ hashFiles('firmware/platformio.ini') }}
        restore-keys: |
          platformio-${{ runner.os }}-espressif32-6.9.0-
          platformio-${{ runner.os }}-

    - name: Install firmware dependencies
      shell: bash
      working-directory: firmware
      run: pio pkg install
